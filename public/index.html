<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 TicTacToe Multiplayer</h1>

        <!-- Login Section -->
        <div id="login-section" class="section">
            <h2>Enter Your Name</h2>
            <input type="text" id="player-name" placeholder="Your name" />
            <button id="join-btn">Join Game</button>
            <div id="connection-status" class="status">Connecting...</div>
        </div>

        <!-- Lobby Section -->
        <div id="lobby-section" class="section hidden">
            <h2>Online Players</h2>
            <div class="info">
                <p>Your ID: <span id="my-player-id"></span></p>
                <p>Your Name: <span id="my-player-name"></span></p>
            </div>
            <div id="players-list" class="players-list">
                <p class="empty-message">No other players online</p>
            </div>

            <div id="challenges-section">
                <h3>Pending Challenges</h3>
                <div id="challenges-list"></div>
            </div>
        </div>

        <!-- Game Section -->
        <div id="game-section" class="section hidden">
            <div class="game-info">
                <p>Playing as: <span id="your-symbol"></span></p>
                <p>Current Turn: <span id="current-turn"></span></p>
                <p>Status: <span id="game-status">In Progress</span></p>
            </div>

            <div id="game-board" class="board">
                <div class="cell" data-row="0" data-col="0"></div>
                <div class="cell" data-row="0" data-col="1"></div>
                <div class="cell" data-row="0" data-col="2"></div>
                <div class="cell" data-row="1" data-col="0"></div>
                <div class="cell" data-row="1" data-col="1"></div>
                <div class="cell" data-row="1" data-col="2"></div>
                <div class="cell" data-row="2" data-col="0"></div>
                <div class="cell" data-row="2" data-col="1"></div>
                <div class="cell" data-row="2" data-col="2"></div>
            </div>

            <button id="back-to-lobby-btn" class="secondary-btn">Back to Lobby</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
